name: apemind-publish

# Builds and pushes ghcr.io/apecloud/dbhub for the apemind/runtime-sync PoC.
on:
  push:
    branches: [apemind/runtime-sync]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/apecloud/dbhub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "tag=1.5.0-apemind.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch_tag=apemind-runtime-sync" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.branch_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
